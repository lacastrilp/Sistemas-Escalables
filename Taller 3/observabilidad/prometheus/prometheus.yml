global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: retail-e3-app
    scrape_interval: 2s
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels: { app: portal-b2b, entregable: e3 }

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:14269"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
